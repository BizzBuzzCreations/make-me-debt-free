# ============================================================
# netlify.toml — MakeMeDebtFree
# ============================================================

# ── Clean URLs for blog posts (removes .html from URL) ──────
# Step 1: Redirect old .html URLs → clean URL (301 permanent)
[[redirects]]
  from   = "/blog-page/:slug.html"
  to     = "/blog-page/:slug"
  status = 301
  force  = true

# Step 2: Serve the actual .html file at the clean URL (200 rewrite)
[[redirects]]
  from   = "/blog-page/:slug"
  to     = "/blog-page/:slug.html"
  status = 200
  force  = true
