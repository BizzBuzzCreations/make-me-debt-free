# ============================================================
# netlify.toml — MakeMeDebtFree
# ============================================================

# Clean URLs for blog posts — serves the .html file at the
# clean URL without showing .html in the browser address bar.
# Applies to all posts inside /blog-page/ automatically.
[[redirects]]
  from   = "/blog-page/:slug"
  to     = "/blog-page/:slug.html"
  status = 200
